*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:DXV,Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#w{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.vg{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 30%,color-mix(in srgb,var(--bg) 70%,transparent) 100%)}
main{zoom:.8;position:relative;z-index:2;max-width:640px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.card{background:color-mix(in srgb,var(--sf) 84%,transparent);border:1px solid var(--ln);border-radius:22px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden}
header.card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;overflow:visible}
.ti{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
h1{font-size:18px;margin:0;font-weight:400}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.id{font-size:13px;background:var(--sf2);border-radius:8px;padding:1px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:none;display:grid;place-items:center;transition:border-color .15s}
.ib:hover{border-color:var(--ac)}
.info{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln)}
.cell{text-align:center;background:color-mix(in srgb,var(--sf) 92%,transparent);padding:9px 16px;min-width:0}
.cell.full{grid-column:1/-1}
.cell em{display:block;font-style:normal;color:var(--mu);font-size:12px;line-height:1.6}
.cell b{display:block;font-weight:400;font-size:15px;overflow-wrap:anywhere}
.cell .st{margin-top:2px}
.cell b.v{direction:ltr;unicode-bidi:isolate}
.st{font-size:12.5px;padding:2px 10px;border-radius:8px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);display:inline-flex;align-items:center;gap:5px}
.st.w{background:color-mix(in srgb,var(--ac2) 18%,transparent);color:var(--ac2)}
.st.e{background:color-mix(in srgb,var(--dg) 16%,transparent);color:var(--dg)}
.st.m{background:var(--sf2);color:var(--mu)}
.st .i{width:14px;height:14px}
.use{margin-top:14px;padding:18px 20px}
.ut{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:28px;line-height:1.3;direction:ltr;unicode-bidi:isolate}
.big small{color:var(--mu);font-size:20px}
.bar{height:10px;border-radius:9px;background:var(--sf2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac);transition:width .6s}
.bar.w i{background:var(--ac2)}.bar.x i{background:var(--dg)}.bar.u i{opacity:.35}
.um{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:13px;margin-top:6px}
.sec{display:flex;align-items:center;gap:14px;color:var(--tx);margin:24px 0 10px;font-size:16px}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--ln)}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;margin-bottom:8px;border-radius:14px;overflow:visible;min-height:52px}
.lk>div:first-child{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;flex:1}
.bs{display:flex;gap:6px;flex-wrap:wrap}.bs:empty{display:none}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.bd{font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:7px;flex:none;direction:ltr;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.sq{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;flex:none;transition:border-color .15s,background .15s,color .15s}
.sq:hover{border-color:var(--ac)}
.sq.ok{background:var(--ac2);border-color:var(--ac2);color:var(--bg)}
.acts{display:flex;gap:6px;flex:none}
.err{margin-top:14px;padding:26px;text-align:center;color:var(--mu)}
dialog{zoom:.8;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:26px;padding:18px;width:min(340px,92vw);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.qt{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px;margin-bottom:12px}
.qt::before,.qt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ln))}
.qt::after{background:linear-gradient(270deg,transparent,var(--ln))}
.qn{display:flex;justify-content:center;margin-bottom:14px}
.qn .bs{justify-content:center}
.qf{position:relative;padding:18px;border-radius:22px;border:1px solid var(--ln);background:var(--sf2)}
.qf i{position:absolute;width:26px;height:26px;border:3px solid var(--mu);opacity:.55}
.qf .c1{top:7px;inset-inline-start:7px;border-width:3px 0 0 3px;border-radius:12px 0 0 0}
.qf .c2{top:7px;inset-inline-end:7px;border-width:3px 3px 0 0;border-radius:0 12px 0 0}
.qf .c3{bottom:7px;inset-inline-start:7px;border-width:0 0 3px 3px;border-radius:0 0 0 12px}
.qf .c4{bottom:7px;inset-inline-end:7px;border-width:0 3px 3px 0;border-radius:0 0 12px 0}
[dir=rtl] .qf .c1{border-width:3px 3px 0 0;border-radius:0 12px 0 0}[dir=rtl] .qf .c2{border-width:3px 0 0 3px;border-radius:12px 0 0 0}
[dir=rtl] .qf .c3{border-width:0 3px 3px 0;border-radius:0 0 12px 0}[dir=rtl] .qf .c4{border-width:0 0 3px 3px;border-radius:0 0 0 12px}
.qb{background:#fff;border-radius:14px;padding:8px;width:210px;max-width:100%;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.qb svg{display:block;width:100%;height:auto}
.qh{margin:12px 0 14px;font-size:13px;color:var(--mu)}
.kv{border:1px solid var(--ln);background:var(--sf2);border-radius:16px;margin-bottom:14px;text-align:start;overflow:hidden}
.kv>div{display:flex;align-items:center;gap:12px;padding:9px 12px}
.kv>div+div{border-top:1px solid var(--ln)}
.kv .ki{width:32px;height:32px;border-radius:10px;background:var(--sf);border:1px solid var(--ln);color:var(--mu);display:grid;place-items:center;flex:none}
.kv .ki .i{width:16px;height:16px}
.kv em{display:block;font-style:normal;color:var(--mu);font-size:11.5px;line-height:1.5}
.kv code{display:block;font-size:12.5px;line-height:1.5;word-break:break-all;direction:ltr;text-align:start;unicode-bidi:isolate}
.kv>div>span:last-child{min-width:0;flex:1}
[dir=rtl] .kv code{text-align:right}

gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(I),gl.STATIC_DRAW);

gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(0,0,0,0);
function size(){var d=Math.min(devicePixelRatio||1,1);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height)}
var T=4,lp=0,ls=0;addEventListener("scroll",function(){ls=performance.now()},{passive:true});

})();
