:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--dg:#ff6b6b}
[data-m=light]{color-scheme:light;--dg:#c62828}
[data-p=mint][data-m=dark]{--bg:#0f1a1c;--sf:#162429;--sf2:#1d2f35;--ln:#2a434b;--tx:#e6efee;--mu:#94acae;--ac:#4fd8b4;--ac2:#f2b25a}
[data-p=mint][data-m=light]{--bg:#f3f7f6;--sf:#fff;--sf2:#e9f1ef;--ln:#d3e2df;--tx:#12282c;--mu:#5a7579;--ac:#0a7a60;--ac2:#9a5a00}
[data-p=indigo][data-m=dark]{--bg:#12131f;--sf:#1a1c2d;--sf2:#232640;--ln:#32365a;--tx:#e8e9f6;--mu:#9a9dc0;--ac:#8f9bff;--ac2:#ffb86b}
[data-p=indigo][data-m=light]{--bg:#f4f5fb;--sf:#fff;--sf2:#eceefa;--ln:#d9dcf0;--tx:#1a1d3a;--mu:#5b5f86;--ac:#4a3fd1;--ac2:#a35a00}
[data-p=ember][data-m=dark]{--bg:#1a1411;--sf:#241c17;--sf2:#2f251e;--ln:#46382e;--tx:#f1e8e0;--mu:#b3a094;--ac:#ff9f5a;--ac2:#7fd6c2}
[data-p=ember][data-m=light]{--bg:#faf4ee;--sf:#fffdfa;--sf2:#f4ebe2;--ln:#e6d8ca;--tx:#2b1d14;--mu:#7a6454;--ac:#b4520c;--ac2:#0e7a68}
[data-p=rose][data-m=dark]{--bg:#190f16;--sf:#24161f;--sf2:#301e2a;--ln:#46283a;--tx:#f3e6ee;--mu:#b59aab;--ac:#ff7eb3;--ac2:#7de0d0}
[data-p=rose][data-m=light]{--bg:#fbf3f7;--sf:#fff;--sf2:#f5e8ef;--ln:#ead3df;--tx:#2a1220;--mu:#7c5a6e;--ac:#b0185f;--ac2:#0b7a6a}
[data-p=graphite][data-m=dark]{--bg:#121214;--sf:#1b1b1f;--sf2:#25252b;--ln:#34343c;--tx:#e6e6ea;--mu:#9d9da8;--ac:#8ab4f8;--ac2:#f2c26b}
[data-p=graphite][data-m=light]{--bg:#f5f5f7;--sf:#fff;--sf2:#ececf0;--ln:#dcdce2;--tx:#18181b;--mu:#5f5f6b;--ac:#1a5fd0;--ac2:#9a5a00}
[data-p=black][data-m=dark]{--bg:#000;--sf:#0a0a0b;--sf2:#111113;--ln:#222226;--tx:#ececef;--mu:#8e8e98;--ac:#151517;--ac2:#f2c26b;--wv:#8c8c96;--wo:.3}
[data-p=black][data-m=light]{--bg:#f5f5f7;--sf:#fff;--sf2:#ececf0;--ln:#cfcfd6;--tx:#111114;--mu:#5f5f6b;--ac:#18181b;--ac2:#9a5a00}
[data-p=black][data-m=dark] .b.p{color:var(--tx);border-color:#2a2a2e}
[data-p=black][data-m=dark] .b.busy::after{border-color:var(--tx);border-top-color:transparent}
[data-p=black][data-m=dark] .in:focus-within{border-color:#3a3a40}
[data-p=black][data-m=dark] :focus-visible{outline-color:#4a4a52}
[data-p=black][data-m=dark] .sw2[aria-checked=true]{background:#2a2a2e}
[data-p=black][data-m=dark] .sw2[aria-checked=true]::after{background:var(--tx)}
[data-p=black][data-m=dark] .brand i{border:1px solid #2a2a2e;color:var(--tx)}
[data-p=black][data-m=dark] .pals button[aria-pressed=true]{border-color:#4a4a52}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:DXV,Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#w{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.vg{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 30%,color-mix(in srgb,var(--bg) 70%,transparent) 100%)}
.wrap{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px 16px 90px}
.card{zoom:.7;width:100%;max-width:430px;background:color-mix(in srgb,var(--sf) 76%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:20px;padding:28px 28px 26px;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--tx) 7%,transparent),0 24px 60px rgba(0,0,0,.25)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--ln)}
.brand i{width:48px;height:48px;border-radius:18px;background:var(--ac);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:17px;letter-spacing:.5px}
h1{font-size:24px;line-height:1.45;margin:0}
.brand i .i{width:26px;height:26px}
h1,.brand p{white-space:nowrap}
[lang=en] h1{font-size:21px}
.brand p{margin:0;color:var(--mu);font-size:15px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:15px;color:var(--mu)}
.in{display:flex;background:var(--sf2);border:1px solid var(--ln);border-radius:14px;transition:border-color .15s}
.in:focus-within{border-color:var(--ac)}
.in.bad{border-color:var(--dg)}
.in input{flex:1;min-width:0;background:none;border:0;padding:10px 14px;min-height:46px;font-size:16px;direction:ltr;text-align:start;outline:0}
.in button{border:0;background:none;color:var(--mu);width:44px;display:grid;place-items:center;border-radius:12px}
.in button:hover{color:var(--tx)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 8px;font-size:15px}
.sw2{flex:none;width:46px;height:26px;border-radius:99px;border:0;background:var(--sf2);position:relative;outline-offset:3px}
.sw2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:inset-inline-start .2s}
.sw2[aria-checked=true]{background:var(--ac)}
.sw2[aria-checked=true]::after{inset-inline-start:23px;background:var(--bg)}
.err{min-height:22px;margin:-4px 0 10px;color:var(--dg);font-size:13.5px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);transition:border-color .15s,transform .1s;position:relative}
.b:hover{border-color:var(--ac)}.b:active{transform:translateY(1px)}
.b.g{background:none}.b.ic{width:40px;padding:0}
.b.p{width:100%;min-height:48px;background:var(--ac);border-color:var(--ac);color:var(--bg);font-size:16px}
.b.busy{pointer-events:none;color:transparent}
.b.busy::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dock{position:fixed;z-index:10;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;border:1px solid var(--ln);border-radius:18px;background:color-mix(in srgb,var(--sf) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);zoom:.85}
.sheet{position:fixed;z-index:11;inset-inline-start:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:320px;max-width:calc(100vw - 32px);background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet[hidden]{display:none}
.sheet h3{font-size:14px;color:var(--mu);margin:0 0 10px;font-weight:400}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pals button{border:2px solid transparent;background:none;border-radius:14px;padding:6px 0;display:grid;gap:4px;justify-items:center;font-size:11.5px;color:var(--mu)}
.pals button[aria-pressed=true]{border-color:var(--ac);color:var(--tx)}
.pals i{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln)}
#toast{position:fixed;inset-inline:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;pointer-events:none;z-index:20}
#toast div{background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:12px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
/* ===== Black x Liquid Glass ===== */
GG{--gl:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.02) 40%,rgba(255,255,255,.015) 62%,rgba(255,255,255,.06));--rim:rgba(255,255,255,.08);--shine:inset 2px 2px 9px -4px rgba(255,255,255,.28),inset -2px -2px 9px -4px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.22);--spec:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.07) 26%,rgba(255,255,255,.03) 64%,rgba(255,255,255,.5));--gb:blur(4px) saturate(130%) brightness(1.15)}
GG body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(34% 22% at 22% 20%,rgba(120,110,200,.13),transparent 72%),radial-gradient(30% 20% at 82% 40%,rgba(90,130,210,.11),transparent 72%),radial-gradient(28% 18% at 40% 85%,rgba(255,255,255,.05),transparent 72%)}
GG .card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:var(--spec);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
GG .card{position:relative}
[data-p=black][data-m=dark]{--wv:#c4c9d8;--wo:.62}

<script>
(function(){

var L="fa",root=document.documentElement,api=(window.DXPanel=window.DXPanel||{api:{}}).api; /* later: DXPanel.api.login=function(c){return fetch(...)} */

setErr("");var b=$("#go");b.classList.add("busy");var c={username:u,password:p,remember:$("#rem").getAttribute("aria-checked")==="true"};
Promise.all([api.login?Promise.resolve(api.login(c)):Promise.resolve(),new Promise(function(r){setTimeout(r,900)})]).then(function(){toast("ok")},function(e){setErr(e&&e.message==="locked"?"eLock":"eBad")}).then(function(){b.classList.remove("busy")})});

/* waves: raw WebGL, horizontal lines only, one draw call */
var tint=function(){};
(function(){var cv=$("#w"),gl=cv.getContext("webgl",{alpha:true,antialias:true,premultipliedAlpha:true});if(!gl)return;
var rm=matchMedia("(prefers-reduced-motion: reduce)").matches,mob=innerWidth<768,R=mob?20:30,C=mob?90:140;
function sh(ty,src){var s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s}
var vs="attribute vec3 a;uniform float t;varying float v;void main(){float x=a.x*a.y*3.,z=a.y;float h=sin(x*.16+z*.12+t*.5)*.8+sin(x*.08-z*.2+t*.33)*.6;float k=1.5;gl_Position=vec4(a.x*1.25,(h-2.5)/z*k+.62,0.,1.);v=(1.-a.z*.8)*(.72+.28*clamp(h*.5+.5,0.,1.))*smoothstep(0.,.08,a.z+.02);}";
var fs="precision mediump float;varying float v;uniform vec3 c;uniform float o;void main(){float a=o*v;gl_FragColor=vec4(c*a,a);}";
var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);
var V=[],I=[],r,c,ia=1/2.2,ib=1/48;
for(r=0;r<R;r++){var s=r/(R-1),z=1/(ia+(ib-ia)*s);for(c=0;c<C;c++){V.push(-1.2+2.4*c/(C-1),z,s);if(c<C-1){var n=r*C+c;I.push(n,n+1)}}}
var vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(V),gl.STATIC_DRAW);
var ib2=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib2);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(I),gl.STATIC_DRAW);
var al=gl.getAttribLocation(p,"a");gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,3,gl.FLOAT,false,0,0);
var ut=gl.getUniformLocation(p,"t"),uc=gl.getUniformLocation(p,"c"),uo=gl.getUniformLocation(p,"o");
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(0,0,0,0);
function size(){var d=Math.min(devicePixelRatio||1,mob?1.25:1.5);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height)}
function draw(ms){gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(ut,ms/1000*.4);gl.drawElements(gl.LINES,I.length,gl.UNSIGNED_SHORT,0)}
tint=function(){var cs=getComputedStyle(root),h=(cs.getPropertyValue("--wv").trim()||cs.getPropertyValue("--ac").trim()).replace("#","");gl.uniform3f(uc,parseInt(h.substr(0,2),16)/255,parseInt(h.substr(2,2),16)/255,parseInt(h.substr(4,2),16)/255);gl.uniform1f(uo,parseFloat(cs.getPropertyValue("--wo"))||(root.dataset.m==="light"?.16:.12));if(rm)draw(4000)};

size();tint();addEventListener("resize",function(){size();if(rm)draw(4000)});
if(rm)draw(4000);else requestAnimationFrame(loop);
})();
