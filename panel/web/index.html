:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--dg:#ff6b6b;--in:#5aa9ff;--ok:#43c47a}
[data-m=light]{color-scheme:light;--dg:#c62828;--in:#1a62c4;--ok:#1b8a4c}
[data-p=mint][data-m=dark]{--bg:#0f1a1c;--sf:#162429;--sf2:#1d2f35;--ln:#2a434b;--tx:#e6efee;--mu:#94acae;--ac:#4fd8b4;--ac2:#f2b25a}
[data-p=mint][data-m=light]{--bg:#f3f7f6;--sf:#fff;--sf2:#e9f1ef;--ln:#d3e2df;--tx:#12282c;--mu:#5a7579;--ac:#0a7a60;--ac2:#9a5a00}

[data-p=indigo][data-m=light]{--bg:#f4f5fb;--sf:#fff;--sf2:#eceefa;--ln:#d9dcf0;--tx:#1a1d3a;--mu:#5b5f86;--ac:#4a3fd1;--ac2:#a35a00}
[data-p=ember][data-m=dark]{--bg:#1a1411;--sf:#241c17;--sf2:#2f251e;--ln:#46382e;--tx:#f1e8e0;--mu:#b3a094;--ac:#ff9f5a;--ac2:#7fd6c2}
[data-p=ember][data-m=light]{--bg:#faf4ee;--sf:#fffdfa;--sf2:#f4ebe2;--ln:#e6d8ca;--tx:#2b1d14;--mu:#7a6454;--ac:#b4520c;--ac2:#0e7a68}
[data-p=rose][data-m=dark]{--bg:#190f16;--sf:#24161f;--sf2:#301e2a;--ln:#46283a;--tx:#f3e6ee;--mu:#b59aab;--ac:#ff7eb3;--ac2:#7de0d0}
[data-p=rose][data-m=light]{--bg:#fbf3f7;--sf:#fff;--sf2:#f5e8ef;--ln:#ead3df;--tx:#2a1220;--mu:#7c5a6e;--ac:#b0185f;--ac2:#0b7a6a}
[data-p=black][data-m=dark]{--bg:#000;--sf:#0a0a0b;--sf2:#111113;--ln:#222226;--tx:#ececef;--mu:#8e8e98;--ac:#151517;--ac2:#f2c26b}
[data-p=black][data-m=light]{--bg:#f5f5f7;--sf:#fff;--sf2:#ececf0;--ln:#cfcfd6;--tx:#111114;--mu:#5f5f6b;--ac:#18181b;--ac2:#9a5a00}
[data-p=black][data-m=dark] .b.p,[data-p=black][data-m=dark] .seg button[aria-pressed=true]{color:var(--tx);border-color:#2a2a2e}
[data-p=black][data-m=dark] .b:hover{border-color:#3a3a40}
[data-p=black][data-m=dark] .b.busy::after{border-color:var(--tx);border-top-color:transparent}
[data-p=black][data-m=dark] :focus-visible{outline-color:#4a4a52}
[data-p=black][data-m=dark] .sw2[aria-checked=true]{background:#2a2a2e}
[data-p=black][data-m=dark] .sw2[aria-checked=true]::after{background:var(--tx)}
[data-p=black][data-m=dark] .chips button[aria-pressed=true],[data-p=black][data-m=dark] .steps .b[aria-pressed=true],[data-p=black][data-m=dark] .pals button[aria-pressed=true]{border-color:#4a4a52;background:#111113}
[data-p=black][data-m=dark] .steps .b[aria-pressed=true] .n{background:#2a2a2e;color:var(--tx)}
[data-p=black][data-m=dark] .st{color:var(--tx);background:#18181b}
[data-p=graphite][data-m=dark]{--bg:#121214;--sf:#1b1b1f;--sf2:#25252b;--ln:#34343c;--tx:#e6e6ea;--mu:#9d9da8;--ac:#8ab4f8;--ac2:#f2c26b}
[data-p=graphite][data-m=light]{--bg:#f5f5f7;--sf:#fff;--sf2:#ececf0;--ln:#dcdce2;--tx:#18181b;--mu:#5f5f6b;--ac:#1a5fd0;--ac2:#9a5a00}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:DXV,Tahoma,sans-serif;line-height:1.7}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{zoom:.85;max-width:1100px;margin:0 auto;padding:24px clamp(14px,4vw,40px) 104px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(22px,4vw,32px);margin:0;line-height:1.3}
.top p{margin:2px 0 0;color:var(--mu);font-size:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.card{background:color-mix(in srgb,var(--sf) 80%,transparent);border:1px solid var(--ln);border-radius:22px;padding:22px;min-width:0}
.card+.card{margin-top:18px}
.col>.card+.card{margin-top:18px}
h2{font-size:16px;margin:0 0 4px;color:var(--mu);font-weight:400}
.pf{margin-top:14px;border:1px solid var(--ln);border-radius:14px;padding:10px 12px;display:grid;gap:8px;font-size:13px;line-height:1.7}.pf div{display:flex;gap:8px;align-items:flex-start}.pf b{flex:none;width:16px;text-align:center}.pf .e b{color:#ef5b5b}.pf .w b{color:#e0a82e}.pf .o b{color:var(--ac)}.pf bdi{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,monospace;font-size:12px}
.hint{font-size:13px;color:var(--mu);margin:0 0 14px}
/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);transition:background .15s,transform .1s,border-color .15s;position:relative}
.b:hover{border-color:var(--ac)}
.b:active{transform:translateY(1px)}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.b.p:hover{background:color-mix(in srgb,var(--ac) 88%,var(--tx))}
.b.g{background:none}
.b.d{background:none;border-color:color-mix(in srgb,var(--dg) 55%,var(--ln));color:var(--dg)}
.b.d:hover{background:color-mix(in srgb,var(--dg) 14%,transparent);border-color:var(--dg)}
.b.d.p{background:var(--dg);color:#fff;border-color:var(--dg)}
.b.s{min-height:34px;padding:3px 12px;font-size:13px;border-radius:10px}
.b.ic{width:40px;padding:0}
.b.ic.s{width:34px}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.busy{pointer-events:none;color:transparent}
.b.busy::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.b:not(.p).busy::after{border-color:var(--ac);border-top-color:transparent}
.b.ok{background:var(--ac2);border-color:var(--ac2);color:var(--bg)}
@keyframes sp{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--sf2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--mu);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--bg)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{text-align:start;padding:10px 12px;border-radius:14px;border:1px solid var(--ln);background:none;display:grid;gap:0}
.chips button small{color:var(--mu);font-size:12px}
.chips button[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.chips b{font-weight:400;direction:ltr;text-align:start}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:13px;color:var(--mu)}
.f input{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;min-height:40px;width:100%;direction:ltr;text-align:start}
.f input:focus-visible{outline-offset:0}
.f input[aria-invalid=true]{border-color:var(--dg)}
.with{display:flex;gap:8px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.sw small{display:block;color:var(--mu);font-size:12px;direction:ltr;text-align:start}
.sw2{flex:none;width:46px;height:26px;border-radius:99px;border:0;background:var(--sf2);position:relative;outline-offset:3px}
.sw2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:inset-inline-start .2s}
.sw2[aria-checked=true]{background:var(--ac)}
.sw2[aria-checked=true]::after{inset-inline-start:23px;background:var(--bg)}
.cmd{margin-top:14px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;color:var(--mu)}
.steps{display:grid;gap:8px}
.steps .b{justify-content:flex-start}
.steps .b[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:var(--ac)}
.steps .b[aria-pressed=true] .n{background:var(--ac);color:var(--bg)}
.n{width:22px;height:22px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-size:12px;flex:none}
.inst{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--ln)}
.inst:first-of-type{border-top:0}
.inst header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.inst b{direction:ltr;font-weight:400}
.st{font-size:12px;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.st.w{background:color-mix(in srgb,var(--ac2) 18%,transparent);color:var(--ac2)}
.meta{color:var(--mu);font-size:13px;direction:ltr;text-align:start}
.empty{color:var(--mu);padding:18px 0;text-align:center}
#toast{position:fixed;inset-inline:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:20}
#toast div{background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#pg-users{zoom:.788}
dialog{zoom:.85;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:22px;max-width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 6px;font-size:18px}
dialog p{margin:0 0 18px;color:var(--mu)}
dialog .row{justify-content:flex-end}
[hidden]{display:none!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock{position:fixed;z-index:10;inset-inline:0;margin-inline:auto;width:max-content;max-width:100vw;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border:1px solid var(--ln);border-radius:20px;background:color-mix(in srgb,var(--sf) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);zoom:.88}
.nv{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 10px;border:0;background:none;color:var(--mu);border-radius:14px;font-size:12px;transition:color .15s,background .15s}
.nv:hover{color:var(--tx)}
.nv[aria-current=page],.nv[aria-expanded=true]{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pals button{border:2px solid transparent;background:none;border-radius:14px;padding:6px 0;display:grid;gap:4px;justify-items:center;font-size:11.5px;color:var(--mu)}
.pals button[aria-pressed=true]{border-color:var(--ac);color:var(--tx)}
.pals i{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln)}
@media(max-width:860px){.grid{grid-template-columns:1fr}.card+.card,.col>.card+.card{margin-top:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
.sub{font-size:14px;color:var(--mu);margin:16px 0 8px;font-weight:400}.sub:first-of-type{margin-top:10px}
.trw{display:grid;gap:18px}
.trw .card+.card{margin-top:0}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sc{padding:16px 16px 0;overflow:hidden}
.sc .sh2{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}
.sc .sh2 .i{color:var(--ac)}
.bn{margin-top:6px}.bn b{font-size:clamp(30px,6vw,42px);line-height:1.2}
.bn small{color:var(--mu);margin-inline-start:4px}
.sc .sub{color:var(--mu);font-size:12.5px;direction:ltr;text-align:start;min-height:21px}
.ap{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:11.5px;margin-top:12px}
.ap em{font-style:normal}
.ap i{font-style:normal;color:var(--tx);direction:ltr;unicode-bidi:isolate}
.spk{margin:6px -16px 0;height:62px}
.spk svg,.big svg{display:block;width:100%;height:100%}
.spk .ln,.big .ln{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.big .ln.up{stroke:var(--ac2)}
.big{height:190px;margin:10px 0 14px}
.big .gl line{stroke:var(--ln);stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.spt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.spt .hint{margin:0;direction:ltr;text-align:start}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.lg em{font-style:normal}
